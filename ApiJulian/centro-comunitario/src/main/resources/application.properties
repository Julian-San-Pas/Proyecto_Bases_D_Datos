# =============================================
# CENTRO COMUNITARIO API - CONFIGURACIÓN
# =============================================

# Server
server.port=8080
spring.application.name=centro-comunitario-api

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/centro_comunitario
spring.data.mongodb.database=centro_comunitario

# Jackson (fechas como strings ISO)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota

# Logging
logging.level.com.centro=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# JWT
app.jwt.secret=CentroComunidadSecretKey2024SuperSegura123456789012345678901234567890
app.jwt.expiration=86400000

# Multipart (archivos adjuntos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
